apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  labels:
    app.kubernetes.io/name: risk-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: risk-engine
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: risk-engine
          image: remote-health-watch/risk-engine
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RISK_DATABASE_URL
              valueFrom: { secretKeyRef: { name: remote-health-watch-secrets, key: RISK_DATABASE_URL } }
            - name: RISK_KAFKA_BOOTSTRAP
              valueFrom: { configMapKeyRef: { name: remote-health-watch-config, key: KAFKA_BOOTSTRAP } }
            - name: RISK_JWT_SIGNING_KEY
              valueFrom: { secretKeyRef: { name: remote-health-watch-secrets, key: JWT_SIGNING_KEY } }
            - name: RISK_PATIENTS_URL
              value: http://patients:8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  labels:
    app.kubernetes.io/name: risk-engine
spec:
  selector:
    app.kubernetes.io/name: risk-engine
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: risk-engine
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: risk-engine
