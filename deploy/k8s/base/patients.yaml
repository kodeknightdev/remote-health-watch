apiVersion: apps/v1
kind: Deployment
metadata:
  name: patients
  labels:
    app.kubernetes.io/name: patients
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patients
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patients
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: patients
          image: remote-health-watch/patients
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: remote-health-watch-config
          env:
            - name: Jwt__SigningKey
              valueFrom: { secretKeyRef: { name: remote-health-watch-secrets, key: JWT_SIGNING_KEY } }
            - name: ConnectionStrings__PatientsDb
              valueFrom: { secretKeyRef: { name: remote-health-watch-secrets, key: PATIENTS_CONNECTION_STRING } }
            - name: Ports__Http
              value: "8080"
            - name: Ports__Grpc
              value: "8081"
            - name: Enrollment__BaselineHours
              value: "24"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: patients
  labels:
    app.kubernetes.io/name: patients
spec:
  selector:
    app.kubernetes.io/name: patients
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: patients
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patients
