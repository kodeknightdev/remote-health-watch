jobs:
  - job: Frontend
    displayName: Angular build and test
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: "22.14.x"
      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | angular-frontend/package-lock.json'
          path: $(Pipeline.Workspace)/.npm
      - script: npm ci --cache $(Pipeline.Workspace)/.npm --no-audit --no-fund
        displayName: npm ci
        workingDirectory: angular-frontend
      - script: npx ng build --configuration production
        displayName: Build
        workingDirectory: angular-frontend
      - script: npx ng test --watch=false --browsers=ChromeHeadlessCI
        displayName: Karma
        workingDirectory: angular-frontend
