apiVersion: apps/v1
kind: Deployment
metadata:
  name: devices
  labels:
    app.kubernetes.io/name: devices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devices
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devices
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: devices
          image: remote-health-watch/devices
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: remote-health-watch-config
          env:
            - name: Jwt__SigningKey
              valueFrom: { secretKeyRef: { name: remote-health-watch-secrets, key: JWT_SIGNING_KEY } }
            - name: ConnectionStrings__DevicesDb
              valueFrom: { secretKeyRef: { name: remote-health-watch-secrets, key: DEVICES_CONNECTION_STRING } }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /alive, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devices
  labels:
    app.kubernetes.io/name: devices
spec:
  selector:
    app.kubernetes.io/name: devices
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: devices
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devices
